name: Panel — gate, then deploy

# Two halves that were missing from each other. There was no CI: a push went
# straight to the droplet with nothing having run the tests. And the deploy
# itself could only ever work once — it `find -delete`d /var/www/shopos-panel,
# which is the git checkout, so the next run pulled into a directory with no
# package.json. The commands below are the ones actually being run by hand on
# the server, which already keep the checkout and the web root apart.

# THE GATE RUNS EVERYWHERE; ONLY ONE BRANCH DEPLOYS. See the note in
# deploy-backend.yml — the same hole, for the same reason: this fired on
# `admin-panel` alone while every commit lands on `offline/v1/admin-panel`, so
# tsc, eslint, vitest and the build ran at merge time and nowhere else.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# One at a time. Two overlapping runs would have the droplet building one commit
# while the other resets the checkout underneath it.
concurrency:
  group: panel-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # matches the droplet
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        # Errors block; the 16 react-hooks advisories are warnings and do not.
        run: npx eslint src

      - name: Tests
        run: npx vitest run

      - name: Known vulnerabilities in what we ship
        # A CVE pass sat on the backlog as a one-off for weeks, which is the
        # wrong shape for it: an audit that was clean in August says nothing
        # about September, and the whole point is the advisory published after
        # somebody looked. So it is a gate, not an errand.
        #
        # `--omit=dev` because this gate is about what reaches the shop's
        # browser. A build tool with an advisory is worth knowing and is not
        # worth blocking a deploy over at 2am; a dependency inside dist/ is.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        # Built here as well as on the droplet, deliberately. A build that fails
        # would otherwise fail on a 1 GB box AFTER the checkout had already been
        # reset to the new commit, leaving the server mid-deploy.
        run: npm run build

  deploy:
    name: Deploy to droplet
    needs: gate
    # The release branch and nothing else. `needs: gate` says the tests must
    # pass; this says where a passing test run is allowed to reach the droplet.
    if: github.ref == 'refs/heads/admin-panel'
    runs-on: ubuntu-latest
    steps:
      - name: Build on the droplet and publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/shopos-panel

            # The droplet was set up with a hand-written copy of this file at the
            # path the repo now tracks, so `git pull` aborts every time with
            # "untracked working tree files would be overwritten". Removing it
            # first makes the fetch deterministic; the reset puts the tracked
            # version back. `.env.production` is untracked and reset leaves it.
            rm -rf .github

            git fetch origin admin-panel
            git reset --hard origin/admin-panel

            npm install
            npm run build

            # Never publish a half-built directory.
            test -s dist/index.html

            cp -r dist/. /var/www/shopos-panel-live/
