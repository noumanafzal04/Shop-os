name: Backend — gate, then deploy

# The deploy steps below are unchanged from what is being run by hand on the
# server; what was missing is everything above them. A push to `backend` ran
# `migrate --force` against the droplet's database with nothing having run the
# test suite first — and a migration is the one step no rollback undoes.

# THE GATE RUNS EVERYWHERE; ONLY ONE BRANCH DEPLOYS.
#
# It used to fire on `backend` alone, and all the work happens on
# `offline/v1/backend` — so the suite ran at MERGE time and nowhere else. Weeks
# of commits could sit on a working branch with a red suite and nothing would
# say so until the moment they were promoted, which is the moment it is most
# expensive to find out.
#
# Deploying is the half that must stay narrow, and it does: the job below is
# fenced to the release branch by `if:`, so a push to any other branch runs the
# tests and stops there.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # matches the droplet
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: App key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        # phpunit.xml pins sqlite :memory:, so no database service is needed.
        #
        # Captured so that a failure can NAME ITSELF. Reading a job's log needs
        # admin rights on this repository — a run that fails tells everybody
        # else only "Process completed with exit code 1", which is how a red
        # gate goes uninvestigated. A step summary needs no such rights.
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/test-output.txt

      - name: Which tests failed
        if: failure()
        # TWO CHANNELS, because they are readable by different people.
        #
        # The step summary is what a human sees in the browser. Annotations are
        # what the REST API hands back WITHOUT admin rights on the repository —
        # and job logs need them, which is how the first red run on this branch
        # could only say "Process completed with exit code 1" to anybody who
        # was not an admin. A gate nobody can diagnose is a gate nobody fixes.
        run: |
          {
            echo '## The suite went red'
            echo
            echo '```'
            tail -n 150 /tmp/test-output.txt || echo 'no output captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Capped: annotations are rate-limited per step, and twenty lines is
          # already enough to name what broke.
          grep -aE 'FAILED|Failed asserting|⨯|✘|"failures"|Tests:' /tmp/test-output.txt \
            | tail -n 20 \
            | while IFS= read -r line; do
                printf '::error::%s\n' "${line//$'\r'/}"
              done || true

      - name: Known vulnerabilities in what we ship
        # A CVE pass was on the backlog as a one-off for weeks, which is the
        # wrong shape for it: an audit that was clean in August says nothing
        # about September, and the whole point is the advisory published after
        # somebody looked. So it is a gate, not an errand.
        #
        # Advisories are about the LOCKFILE, so this runs before the deploy and
        # fails it — shipping a known-vulnerable dependency to a machine that
        # holds shops' takings is not a warning.
        run: composer audit --locked

      - name: Migrations go back down as well as up
        # The suite only ever runs `migrate:fresh`, so the DOWN path had never
        # been executed by anything — and both directions were broken: a column
        # was dropped while an index still named it. That makes rollback the
        # recovery path for a bad deploy that does not exist when it is needed.
        #
        # Run against a FILE database rather than :memory:, since each artisan
        # call is its own process and an in-memory database would not survive
        # between them.
        run: |
          touch database/audit.sqlite
          export DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/audit.sqlite"
          php artisan migrate --force
          php artisan migrate:rollback --step=999 --force
          php artisan migrate --force
          rm -f database/audit.sqlite

  deploy:
    name: Deploy to droplet
    needs: gate
    # The release branch and nothing else. `needs: gate` says the tests must
    # pass; this says where a passing test run is allowed to reach a server that
    # holds shops' takings.
    if: github.ref == 'refs/heads/backend'
    runs-on: ubuntu-latest
    steps:
      - name: Pull, migrate, cache, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/shopos-api

            # Same untracked-workflow collision as the panel: the server has a
            # hand-written copy at the path the repo tracks, which aborts `git
            # pull`. The reset restores the tracked version. `.env` is untracked
            # and survives.
            rm -rf .github

            git fetch origin backend
            git reset --hard origin/backend

            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chown -R www-data:www-data storage bootstrap/cache
            supervisorctl restart shopos-worker
