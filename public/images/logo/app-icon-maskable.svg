    <path d="M8 9.4h2.1l1 3m0 0 1.7 6.2a1.6 1.6 0 0 0 1.55 1.2h6.3a1.6 1.6 0 0 0 1.55-1.2l1.25-4.6a1.1 1.1 0 0 0-1.06-1.4H11.1"
          stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="14.4" cy="23.2" r="1.5" fill="white"/>
    <circle cx="21.4" cy="23.2" r="1.5" fill="white"/>
  </g>
</svg>
