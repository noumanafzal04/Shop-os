<svg width="512" height="512" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MASKABLE: a separate drawing, not the same file relabelled. Android crops
       this to whatever shape the launcher uses — circle, squircle, teardrop —
       so the ground is full-bleed and the basket sits inside the middle ~60%.
       Handing it the rounded-square badge means the corners get cut off and the
       mark inside them with it. -->
