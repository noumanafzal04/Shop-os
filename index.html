<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `type` said SVG for a PNG. Browsers sniff and cope; a manifest
         validator does not. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab said "localhost". A till is one of half a dozen tabs open on a
         shop's computer all day, and the only thing that tells them apart is
         this line. -->
    <title>True Serve</title>
    <meta name="description" content="True Serve — point of sale and shop management for Pakistani businesses." />
    <meta name="theme-color" content="#0755e9" />

    <!-- ── iOS DOES NOT READ THE MANIFEST FOR ANY OF THIS ──────────────
       ·
       · A shop could not install the app on an iPad, and the reason is that
       · every line below was missing. Safari ignores `manifest.webmanifest`
       · for the home-screen icon and, before 16.4, for `display: standalone`
       · too — so "Add to Home Screen" produced a bookmark with a SCREENSHOT
       · of the page as its icon, opening in a Safari tab with the address bar
       · on top. On Android the same manifest installs a real app, which is
       · why this went unnoticed.
       ·
       · `apple-touch-icon` — the icon. 180×180 is what iOS asks for; the
       ·   192 we already ship is scaled and is the honest thing to point at
       ·   until a 180 exists.
       · `apple-mobile-web-app-capable` — open WITHOUT Safari's chrome. The
       ·   `mobile-web-app-capable` twin is the standard name every other
       ·   browser reads; both are given because neither covers both.
       · `…-title` — what sits under the icon. Without it iOS uses <title>,
       ·   which is fine today and drifts the moment the title gains a suffix.
       · `…-status-bar-style` — `black-translucent` would put the clock over
       ·   the app's own header, and nothing here pads for a safe area yet.
       ·   `default` keeps the status bar as its own strip.
       ·
       · NOT added: `viewport-fit=cover`. It is the other half of a proper iOS
       · install and it is a separate job — without `env(safe-area-inset-*)`
       · padding, which exactly one component in this app has, it would push
       · the till's own controls under the home indicator. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="True Serve" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body class="dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- ── A PAGE THAT NEVER STARTS MENDS ITSELF, ONCE ────────────────
       ·
       · `src/main.tsx` marks the page the moment it runs. A page that has
       · loaded without the mark never ran the app: the offline copy on this
       · device holds a broken file. It once held an EMPTY main script, and
       · every load was white until a hard reload.
       ·
       · So, if the server answers, the stored copy is thrown away and the
       · page loads once more from the server; the app stores a fresh copy as
       · it starts. Nothing else is touched — unsent sales live in IndexedDB.
       · Offline, nothing is thrown away: a broken copy is still the only one.
       · Once per tab in five minutes, so a page broken for another reason is
       · not reloaded in a loop. -->
    <script>
      (function (window) {
        var KEY = "shopos-boot-mended";
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            if (window.document.documentElement.hasAttribute("data-booted")) return;
            try {
              var last = Number(window.sessionStorage.getItem(KEY) || 0);
              if (Date.now() - last < 5 * 60 * 1000) return;
              window.sessionStorage.setItem(KEY, String(Date.now()));
            } catch (e) {
              return;
            }
            // A query the stored copy does not hold, so the answer is the server's.
            window
              .fetch("/index.html?alive=" + Date.now(), { cache: "no-store" })
              .then(function (response) {
                if (!response.ok) return;
                var jobs = [];
                if (window.caches) {
                  jobs.push(
                    window.caches.keys().then(function (names) {
                      return Promise.all(
                        names
                          .filter(function (name) { return name.indexOf("-precache-") !== -1; })
                          .map(function (name) { return window.caches.delete(name); }),
                      );
                    }),
                  );
                }
                if (window.navigator.serviceWorker) {
                  jobs.push(
                    window.navigator.serviceWorker.getRegistrations().then(function (all) {
                      return Promise.all(
                        all
                          .filter(function (r) {
                            var w = r.active || r.waiting || r.installing;
                            return w && /\/sw\.js$/.test(new URL(w.scriptURL).pathname);
                          })
                          .map(function (r) { return r.unregister(); }),
                      );
                    }),
                  );
                }
                return Promise.all(jobs).then(function () {
                  window.location.reload();
                });
              })
              .catch(function () {});
          }, 2000);
        });
      })(window);
    </script>
  </body>
</html>
